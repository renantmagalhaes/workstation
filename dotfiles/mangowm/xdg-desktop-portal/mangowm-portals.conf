# XDG_CURRENT_DESKTOP is set to MangoWM in envs.conf, so xdg-desktop-portal looks for
# mangowm-portals.conf (the mango package only ships mango-portals.conf).
# Symlink: ~/.config/xdg-desktop-portal -> dotfiles/mangowm/xdg-desktop-portal
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
