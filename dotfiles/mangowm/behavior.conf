# Window Manager Behavior & Miscellaneous settings

# Configuration Management (v0.18.0+)
auto_reload_config=1    # Automatically reload configuration on file change

# Overview Setting
hotarea_size=1        # Pixels for hotarea detection
hotarea_corner=0       # 0=TOP_LEFT, 1=TOP_RIGHT, 2=BOTTOM_LEFT, 3=BOTTOM_RIGHT
enable_hotarea=0       # Trigger overview mode via mouse corner
overview_gap_inner=5   # Inner gap size (pixels) between windows in overview
overview_gap_outer=30  # Outer gap size (pixels) between windows and screen edges

# Window Manager Behavior
no_border_when_single=0         # Remove borders when only one window is visible (1=yes)
axis_bind_apply_timeout=100     # Timeout (ms) for scroll event key bindings
focus_on_activate=1             # Focus windows when they request activation
idle_inhibit_ignore_visible=0   # Allow background apps to inhibit sleep
sloppy_focus=1                  # Focus follows the mouse cursor
warp_cursor=0                   # Center mouse cursor on window when focus shifts via keyboard
focus_cross_monitor=0           # Allow focus to jump to another monitor using directional keys
focus_cross_tag=0               # Allow focus to jump into other tags
enable_floating_snap=0          # Snap floating windows to other windows/edges
snap_distance=30                # Pixels needed to trigger window snapping
cursor_size=24                  # Pointer size
drag_tile_to_tile=1             # Drag tiled window onto another to stack/swap
disable_middle_paste=0          # Disable middle-click paste (0=allow, 1=disable)

# Edge & Border Resizing (v0.18.0+)
enable_border_resize=1          # Drag window borders directly to resize (like Sway), no Super key needed
border_resize_size=6            # Thickness (px) of the edge grab strip

# Window Group & Tab Bar (v0.18.0+)
always_show_group_bar=0         # 1=Always show window title/group bar, 0=Only when grouped
group_bar_close_button_enable=1 # Display a close button on the group bar


# Scratchpad Settings
scratchpad_cross_monitor=1      # Pool scratchpads across all monitors (1=yes)
scratchpad_width_ratio=0.9      # Width of scratchpad relative to monitor (0.0 - 1.0)
scratchpad_height_ratio=0.9     # Height of scratchpad relative to monitor (0.0 - 1.0)

