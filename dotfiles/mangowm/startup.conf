# =============================================================================
# MangoWM Autostart Configuration
# =============================================================================

# --- System & Authentication ---
# Authentication Agent for Polkit
exec_once=/usr/libexec/polkit-mate-authentication-agent-1

# Start keyd service for keyboard mapping/remapping
exec_once=sudo systemctl start keyd.service


# --- Desktop Environment & UI Components ---
# Main status bar: QuickShell "dynamic island", top-centre, one per monitor.
exec_once=quickshell -n -p ~/.dotfiles/mangowm/quickshell-bar

# Previous Waybar panel -- uncomment this (and comment the line above) to revert.
# exec_once=waybar -c ~/.dotfiles/mangowm/waybar/config.jsonc -s ~/.dotfiles/mangowm/waybar/style.css
# exec_once=waybar -c ~/.dotfiles/mangowm/waybar/config-for-catppuccin.jsonc -s ~/.dotfiles/mangowm/waybar/style-for-catppuccin.css

# Secondary Waybar panel for trigger/hotspots (dormant: now handled natively by QuickShell EdgeTriggers)
# exec_once=waybar -c ~/.dotfiles/mangowm/waybar/trigger_config.jsonc -s ~/.dotfiles/mangowm/waybar/trigger_style.css

# Wallpaper daemon (Awww)
exec_once=awww-daemon

# Mako notification daemon (dormant: using QuickShell native NotificationServer)
# exec_once=mako


# --- Keyboard, Mouse & Clipboard Utilities ---
# Custom mouse actions handling script
exec_once=~/.dotfiles/mangowm/scripts/mouse_actions.py --invert-hwheel

# Custom top-left hotarea watcher script (triggers toggle_all_overviews.sh) (disabled)
# exec_once=~/.dotfiles/mangowm/scripts/hotarea_watcher.py

# INZONE Buds battery listener. Must run as a daemon: the dongle cannot be polled,
# it only pushes an unsolicited HID report every ~6-7 min, so the value has to be
# caught as it arrives and cached. Read it back with `inzone-battery.py`.
exec_once=~/.dotfiles/mangowm/scripts/inzone-battery.py --daemon

# Waybar status/scroll indicator watcher script
# exec_once=~/.dotfiles/mangowm/waybar/scripts/waybar_indicator_watcher.sh

# Clipboard manager (CopyQ) - Native Wayland support (v12+) via xdg-desktop-portal.
#
# MangoWM does not activate systemd's `user` graphical-session.target, so systemd
# will never start xdg-desktop-portal (its unit has Requisite=graphical-session.target
# and that target refuses manual start). Without the portal, Flatpak CopyQ cannot
# read the Wayland clipboard ("Cannot connect to server" / no monitorClipboard process).
# Fix: launch the portal daemon (and its GTK backend) directly at session start.
exec_once=/usr/libexec/xdg-desktop-portal
exec_once=sh -c 'test -x /usr/libexec/xdg-desktop-portal-gtk && /usr/libexec/xdg-desktop-portal-gtk &'

# Launch CopyQ's server hidden (uses --start-server like the app's own .desktop file).
exec_once=flatpak run --command=copyq com.github.hluk.copyq --start-server --start-hidden

# Previous clipboard manager (Cliphist + Rofi) - kept for reference. Uncomment to use instead of CopyQ.
# exec_once=wl-paste --type text --watch cliphist store
# exec_once=wl-paste --type image --watch cliphist store


# --- Connectivity & Network ---
# Network Manager applet
# exec_once=nm-applet

# KDE Connect daemon and system tray indicator
exec_once=kdeconnectd
exec_once=kdeconnect-indicator

# MPRIS activity tracker — makes playerctl route to the most-recently-active player
exec_once=playerctld


# --- Security & Applications ---
# 1Password password manager - Start minimized in background
exec_once=/usr/bin/1password --silent


# --- Maintenance & Workarounds ---
# Remove Vivaldi singleton lock files to prevent startup warnings/failures
exec_once=rm -rf ~/.config/vivaldi/Singleton*

# --- System Utilities ---
# exec_once=systemctl --user enable --now vicinae.service

# --- Commented / Disabled Startup Items ---
# exec_once=hypridle
# exec_once=~/.config/hypr/scripts/launch-kitty-magic.sh
# Service watchdog (restart crashed processes)
exec_once=~/.dotfiles/mangowm/scripts/watchdog.sh
# Battery watchdog (low battery mako notifications, checks every 15 min)
exec_once=~/.dotfiles/mangowm/scripts/battery-watchdog.sh
# exec_once=~/.QS-Launcher/spotlight
