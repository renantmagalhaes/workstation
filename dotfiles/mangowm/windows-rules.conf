# Add blur to apps
## Nautilkus
windowrule=focused_opacity:0.95,appid:Nautilus
windowrule=unfocused_opacity:0.8,appid:Nautilus

## Vscode
windowrule=focused_opacity:0.98,appid:code
windowrule=unfocused_opacity:0.9,appid:code

## Vscode
windowrule=focused_opacity:0.98,appid:antigravity
windowrule=unfocused_opacity:0.9,appid:antigravity

# QuickShell island bar. Its surface spans the whole output (mostly
# transparent, with input masked to the pill), so blurring behind it would cost
# GPU time across the entire screen for no visible gain -- the pill itself is
# 95% opaque.
layerrule=noblur:1,layer_name:quickshell-island

# Screenshot app rules
layerrule=noanim:1,noblur:1,layer_name:selection
windowrule=isfloating:1,appid:swappy

# Screenshot app rules
layerrule=noanim:1,noblur:1,layer_name:selection
windowrule=isfloating:1,appid:flameshot

# Clipboard manager (CopyQ) - keep its history window floating, sized to ~70% of the screen.
# width/height values below 1 are treated as a percentage of the screen (MangoWM windowrule docs).
windowrule=isfloating:1,width:0.7,height:0.7,appid:com.github.hluk.copyq
