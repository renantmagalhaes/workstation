# Add blur to apps
## Nautilus
window_rule=focused_opacity:0.95,app_id:Nautilus
window_rule=unfocused_opacity:0.8,app_id:Nautilus

## Vscode
window_rule=focused_opacity:0.98,app_id:code
window_rule=unfocused_opacity:0.9,app_id:code

## Antigravity
window_rule=focused_opacity:0.98,app_id:antigravity
window_rule=unfocused_opacity:0.9,app_id:antigravity

# QuickShell island bar. Blur is deliberately left ON: the bar's themes can be
# run translucent, and mango only composites blur where the surface actually
# draws -- verified that a full-output layer surface does not blur the whole
# screen. With an opaque theme the blur is simply not visible.

# QuickShell spotlight launcher: compositor blur is enabled (with blur_optimized=0, it blurs underlying open windows)
# layer_rule=no_blur:0,layer_name:quickshell-launcher

# Screenshot app rules
layer_rule=no_animation:1,no_blur:1,layer_name:selection
window_rule=is_floating:1,app_id:swappy

# Screenshot app rules
layer_rule=no_animation:1,no_blur:1,layer_name:selection
window_rule=is_floating:1,app_id:flameshot

# Clipboard manager (CopyQ) - keep its history window floating, sized to ~70% of the screen.
# width/height values below 1 are treated as a percentage of the screen (MangoWM window_rule docs).
window_rule=is_floating:1,width:0.7,height:0.7,app_id:com.github.hluk.copyq
