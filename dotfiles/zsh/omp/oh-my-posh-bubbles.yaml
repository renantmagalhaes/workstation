# --------------------------------------------------------------------------------
# SCHEMA DECLARATION
# --------------------------------------------------------------------------------
# This line helps your editor or language server recognize valid configuration keys.
# It doesn't affect how Oh My Posh itself parses the file.
# --------------------------------------------------------------------------------
# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

# --------------------------------------------------------------------------------
# MAIN CONFIGURATION
# --------------------------------------------------------------------------------
# "blocks" is the root list of prompt blocks. Each block has a "type", alignment,
# and one or more segments that define what shows up in your prompt.
# --------------------------------------------------------------------------------
palette:
  connector: "#FFD787"
  surface: "#29315A"
  text: "#FFFFFF"
  text-dark: "#000000"

  path-background: "#FFFFFF"
  path-readonly: "#FF0000"
  status-background: "#B388FF"
  status-error: "#E91E63"
  prompt-error: "#7617F6"
  prompt-symbol: "#FFFFF1"
  transient: "#8B7CFC"

  aws: "#FF9900"
  lua: "#00AEEF"
  python: "#E4F34A"
  go: "#7FD5EA"
  node: "#42E66C"
  ruby: "#E64747"
  java: "#E64747"
  julia: "#9B6BDF"
  php: "#4063D8"
  npm: "#CB3837"
  terraform: "#5C4EE5"
  kubernetes: "#0072CE"
  kubernetes-background: "#FFFFF1"
  execution-time: "#AEA4BF"

  git-label-bg: "p:surface"
  git-label-fg: "p:text"
  git-text: "#32174D"
  git-clean: "#42E66C"
  git-dirty: "#FF9248"
  git-ahead: "#35B5FF"
  git-behind: "#F89CFA"
  git-diverged: "#FF5F5F"
# ==============================================================================
# BLOCK 1: LEFT Prompt (TOP LINE)
# ==============================================================================
blocks:
  - type: prompt
    alignment: left
    segments:
      # --------------------------------------------------------------------------
      # Upper-left status segment: prints the "┌" character.
      # --------------------------------------------------------------------------
      - properties:
          always_enabled: true
        template: "\u250c "
        foreground: "p:connector"
        type: status
        style: plain

      # --------------------------------------------------------------------------
      # Icon segment: Prints the diamond icon "" with its own styling.
      # --------------------------------------------------------------------------
      - leading_diamond: ""
        trailing_diamond: ""
        template: ""
        background: "p:surface"
        foreground: "p:text"
        type: text
        style: diamond

      # --------------------------------------------------------------------------
      # Path segment: Displays your current working directory.
      # --------------------------------------------------------------------------
      - properties:
          style: full
        leading_diamond: " "
        trailing_diamond: " "
        template: >-
          <b>{{ if eq .Path "~" }}󰟒 ~
          {{ else if or (eq .Path "~/Documents") (hasPrefix .Path "~/Documents/") }}󰈙 {{ .Path}}
          {{ else if or (eq .Path "~/Downloads") (hasPrefix .Path "~/Downloads/") }} {{ .Path}}
          {{ else if or (eq .Path "~/Music") (hasPrefix .Path "~/Music/") }} {{ .Path }}
          {{ else if or (eq .Path "~/Pictures") (hasPrefix .Path "~/Pictures/") }}  {{ .Path }}
          {{ else if or (eq .Path "~/Images") (hasPrefix .Path "~/Images/") }}  {{ .Path }}
          {{ else if hasPrefix .Path "~/" }}󰟒 {{ .Path }}
          {{ else }}  {{ .Path }}
          {{- end }}{{ if not .Writable }}{{ end }}</b>
        foreground: "p:text-dark"
        background: "p:path-background"
        type: path
        style: diamond
        foreground_templates:
          - "{{ if not .Writable }}p:path-readonly{{ end }}"

      # --------------------------------------------------------------------------
      #  Extra Trailing Diamond segment: Only displays when not inside a Git folder.
      #     Its background is explicitly set to transparent (or "default") so that it
      #     looks like part of the path.
      # --------------------------------------------------------------------------
      # - type: text
      #   template: "{{ if not .Segments.git }}{{ end }}"
      #   background: default # Try "transparent" if your terminal supports it.
      #   foreground: "p:text" # Use the same as your path text, or adjust as needed.
      #   style: plain

      # --------------------------------------------------------------------------
      # Git segment: Displays Git info (branch, changes, etc.),
      #     and is assigned an alias ("git") for cross‑segment reference.
      # --------------------------------------------------------------------------
      - leading_diamond: ""
        trailing_diamond: ""
        template: "{{ if .Segments.git }}on{{ end }}"
        background: "p:git-label-bg"
        foreground: "p:git-label-fg"
        type: text
        style: diamond
        condition: git

      - properties:
          branch_max_length: 25.0
          branch_icon: " "
          fetch_stash_count: true
          # Shows working-tree and staging status; disable only if large repos make
          # prompt rendering noticeably slow.
          fetch_status: true
          fetch_upstream_icon: false
        alias: git
        leading_diamond: " "
        trailing_diamond: ""
        template: "{{.UpstreamIcon }}{{.HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uf046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} \ueb4b {{ .StashCount }}{{ end }}"
        foreground: "p:git-text"
        background: "p:git-clean"
        type: git
        style: diamond
        background_templates:
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-diverged{{ end }}"
          - "{{ if gt .Behind 0 }}p:git-behind{{ end }}"
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}p:git-dirty{{ end }}"
          - "{{ if gt .Ahead 0 }}p:git-ahead{{ end }}"

      # --------------------------------------------------------------------------
      # Check if user has root credentials cached. if not show username else show wizard
      # --------------------------------------------------------------------------

      - type: command
        # style: diamond
        style: plain
        # foreground: "p:text"
        # background: "p:surface"
        # leading_diamond: ""
        # trailing_diamond: ""
        properties:
          shell: bash
          command: sudo -n true 2>/dev/null && echo "as 🧙" || echo -n $'\u200B'
  # ==============================================================================
  # BLOCK 2: RIGHT Prompt
  # ==============================================================================
  - type: prompt
    alignment: right
    segments:
      # --------------------------------------------------------------------------
      # Command Status segment:
      # Displays a checkmark if the last command returned 0 (success),
      # or a cross if it did not execute correctly.
      # --------------------------------------------------------------------------
      - type: status
        style: diamond
        foreground: "p:text"
        background: "p:status-background"
        leading_diamond: ""
        background_templates:
          - "{{ if .Error }}p:status-error{{ end }}"
        trailing_diamond: " "
        template: "{{ if eq .Code 0 }}{{ else }}\uf071 {{ reason .Code }}{{ end }}"
        properties:
          always_enabled: false

      # --------------------------------------------------------------------------
      # AWS segment: Displays AWS profile and region (if set).
      #    - fetch_version: false => doesn't fetch AWS CLI version info, only profile.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: " {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }}"
        foreground: "p:aws"
        background: "p:surface"
        type: aws
        style: diamond

      # - type: command
      #   style: diamond
      #   foreground: "p:aws"
      #   background: "p:surface"
      #   leading_diamond: "" # Left empty to connect from the previous segment.
      # trailing_diamond: " " # The final closing diamond for the block.
      #   template: "| {{ .Output }}" # A separator and the Account ID fetched from the command.
      #   properties:
      #     # This command fetches the AWS Account ID.
      #     # Make sure the AWS CLI is installed and configured.
      #     command: "aws sts get-caller-identity --query Account --output text"
      #     # You can set a timeout in milliseconds in case the command is slow
      #     # timeout: 2000

      # --------------------------------------------------------------------------
      # Lua segment: Shows Lua version (disabled here with fetch_version: false).
      #    It will only appear if you have Lua installed, but won't display version.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: "\ue620 {{ .Full }}"
        foreground: "p:lua"
        background: "p:surface"
        type: lua
        style: diamond

      # --------------------------------------------------------------------------
      # Python segment: Shows active Python version or virtual environment name.
      #    - {{ .Venv }} => name of your active venv, if any
      #    - {{ .Full }} => Python version string
      #    - Displays an error if Python can't be found.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: " {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }}{{ end }}{{ .Full }}{{ end }}"
        foreground: "p:python"
        background: "p:surface"
        type: python
        style: diamond

      # --------------------------------------------------------------------------
      # Go segment: Shows Go version if Go is installed.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
        foreground: "p:go"
        background: "p:surface"
        type: go
        style: diamond

      # --------------------------------------------------------------------------
      # Node segment: shows the package manager (when available) and Node version.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: true
        leading_diamond: ""
        trailing_diamond: " "
        template: " {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}"
        foreground: "p:node"
        background: "p:surface"
        type: node
        style: diamond

      # --------------------------------------------------------------------------
      # Ruby segment: Shows Ruby version, or an error if Ruby not found.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
        foreground: "p:ruby"
        background: "p:surface"
        type: ruby
        style: diamond

      # --------------------------------------------------------------------------
      # Java segment: Shows Java version, or an error if not found.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: "{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
        foreground: "p:java"
        background: "p:surface"
        type: java
        style: diamond

      # --------------------------------------------------------------------------
      # Julia segment: Shows Julia version, or an error if not found.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: "\ue624{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
        foreground: "p:julia"
        background: "p:surface"
        type: julia
        style: diamond

      # --------------------------------------------------------------------------
      # PHP segment: Shows PHP version.
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        template: "\ue73d {{ .Full }} "
        foreground: "p:text"
        background: "p:php"
        type: php
        style: diamond

      # --------------------------------------------------------------------------
      # Execution Time segment: Shows how long the previous command took
      #     if it's above the "threshold" (5000 ms by default).
      # --------------------------------------------------------------------------
      - properties:
          style: austin
          threshold: 5000.0
        leading_diamond: ""
        trailing_diamond: " "
        template: " {{ .FormattedMs }}"
        foreground: "p:execution-time"
        background: "p:surface"
        type: executiontime
        style: diamond
      # --------------------------------------------------------------------------
      # Kubernetes segment: shows the current kube context (and namespace)
      # --------------------------------------------------------------------------

      - type: kubectl
        style: diamond
        leading_diamond: ""
        trailing_diamond: " "
        foreground: "p:kubernetes"
        background: "p:kubernetes-background"
        template: "󱃾 {{ .Context }}{{ if .Namespace }} | {{ .Namespace }}{{ end }}"
        properties:
          # optional:
          parse_kubeconfig: true
          display_error: false
          # fetch_version is not a typical property for the built-in 'kubernetes' segment,
          # but if it works in your version, no harm. If not, remove it.
          # fetch_version: false
          # optional for custom names:
          # context_aliases:
          #   arn:aws:eks:eu-west-1:1234567890:cluster/posh: posh

      # --------------------------------------------------------------------------
      # NPM segment: shows the npm version if installed
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        # icon: "" is the popular Nerd Fonts icon for NPM
        template: " {{ .Full }}"
        foreground: "p:npm"
        background: "p:surface"
        type: npm
        style: diamond

      # --------------------------------------------------------------------------
      # Terraform segment: shows Terraform version if installed
      # --------------------------------------------------------------------------
      - properties:
          fetch_version: false
        leading_diamond: ""
        trailing_diamond: " "
        # You can swap "terraform:" for a TF icon if you have a Nerd Fonts symbol
        template: "󱁢 {{.WorkspaceName}}"
        foreground: "p:terraform"
        background: "p:text"
        type: terraform
        style: diamond

  # ==============================================================================
  # BLOCK 3: LEFT Prompt (SECOND LINE)
  # ==============================================================================
  - type: prompt
    alignment: left
    segments:
      # --------------------------------------------------------------------------
      # Another "status" segment printing the lower-left corner (└).
      # --------------------------------------------------------------------------
      - properties:
          always_enabled: true
        # template: "╰─"
        template: "\u2514"
        foreground: "p:connector"
        type: status
        style: plain

      # --------------------------------------------------------------------------
      # Another "status" segment displaying the actual prompt symbol "$".
      # --------------------------------------------------------------------------
      - properties:
          always_enabled: true
        # template: " "
        template: "  "
        foreground: "p:prompt-symbol"
        foreground_templates:
          - "{{ if ne .Code 0 }}p:prompt-error{{ end }}"
        type: status
        style: plain

    # newline: true => After these segments, Oh My Posh will break the line
    # and place the cursor for you to start typing your command.
    newline: true

# --------------------------------------------------------------------------------
# TRANSIENT PROMPT
# --------------------------------------------------------------------------------
# After you run a command, some shells let the old prompt line be "collapsed"
# into a simpler prompt. That's what transient_prompt does here.
# --------------------------------------------------------------------------------
transient_prompt:
  background: transparent
  foreground: "p:transient"
  # template: " "
  template: " "
  # newline: true

# --------------------------------------------------------------------------------
# MISCELLANEOUS SETTINGS
# --------------------------------------------------------------------------------
auto_upgrade: false # if true, oh-my-posh updates itself automatically
version: 3 # Oh My Posh configuration version
